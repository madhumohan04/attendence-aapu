    function createLucideIcon(iconName) {
      return function LucideIcon({ className = "" }) {
        const spanRef = useRef(null);
        useEffect(() => {
          if (spanRef.current && window.lucide && window.lucide.icons[iconName]) {
            const svg = window.lucide.createElement(window.lucide.icons[iconName]);
            if (className) {
              svg.setAttribute("class", className);
            }
            spanRef.current.innerHTML = "";
            spanRef.current.appendChild(svg);
          }
        }, [className]);

        return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
      };
    }

    // --- REAL FACIAL BIOMETRIC VISUAL FINGERPRINT & SIMILARITY HELPER ---
    // Computes an 8x8 luminance/color signature from any video frame or enrolled image
    function computeImageBiometricVector(sourceEl) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 16;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(sourceEl, 0, 0, 16, 16);
        const data = ctx.getImageData(0, 0, 16, 16).data;
        const vec = [];
        for (let i = 0; i < data.length; i += 4) {
          // Normalized RGB + luminance channels
          vec.push(data[i] / 255, data[i + 1] / 255, data[i + 2] / 255);
        }
        return vec;
      } catch (e) {
        return null;
      }
    }

    function computeCosineSimilarity(vecA, vecB) {
      if (!vecA || !vecB || vecA.length !== vecB.length) return null;
      let dot = 0, magA = 0, magB = 0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
        magA += vecA[i] * vecA[i];
        magB += vecB[i] * vecB[i];
      }
      if (magA === 0 || magB === 0) return null;
      return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    // --- UNIQUE PER-STUDENT QR MATRIX GENERATOR ---
    // Generates a distinct 13x13 QR code matrix uniquely tied to each student's roll/ID and token
    function UniqueStudentQrMatrix({ value, size = 128, className = "" }) {
      const gridSize = 13;
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const isFinder = (r, c) => {
        if (r < 4 && c < 4) {
          if (r === 3 || c === 3) return false;
          return r === 0 || r === 2 || c === 0 || c === 2 || (r === 1 && c === 1);
        }
        if (r < 4 && c >= gridSize - 4) {
          const lc = c - (gridSize - 4);
          if (r === 3 || lc === 0) return false;
          return r === 0 || r === 2 || lc === 1 || lc === 3 || (r === 1 && lc === 2);
        }
        if (r >= gridSize - 4 && c < 4) {
          const lr = r - (gridSize - 4);
          if (lr === 0 || c === 3) return false;
          return lr === 1 || lr === 3 || c === 0 || c === 2 || (lr === 2 && c === 1);
        }
        return null;
      };

      const cells = [];
      let seed = hash >>> 0;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const finderVal = isFinder(r, c);
          let filled = false;
          if (finderVal !== null) {
            filled = finderVal;
          } else {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            filled = ((seed >>> 16) & 1) === 1;
          }
          if (filled) {
            cells.push(<rect key={`${r}-${c}`} x={c} y={r} width="1" height="1" fill="#0f172a" />);
          }
        }
      }

      return (
        <svg
          width={size}
          height={size}
          viewBox={`0 0 ${gridSize} ${gridSize}`}
          className={className}
          shapeRendering="crispEdges"
        >
          <rect x="0" y="0" width={gridSize} height={gridSize} fill="#ffffff" />
          {cells}
        </svg>
      );
    }

                    </button>
                  ))}
              </div>
              <div className="grid grid-cols-2 gap-1.5 text-center font-mono pt-1 border-t border-slate-800/80">
                {users
                  .filter((u) => u.role === 'faculty')
                  .slice(0, 1)
                  .map((f) => (
                    <button
                      key={f.id}
                      type="button"
                      onClick={() => {
                        setActiveRoleTab('faculty');
                        setIdInput(f.id);
                        setPassInput(f.pass);
                      }}
                      className="p-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-emerald-300 text-[10px] font-semibold cursor-pointer truncate px-2"
                      title={`${f.name} (${f.id})`}
                    >
                      {f.name} ({f.id})
                    </button>
                  ))}
                {users
                  .filter((u) => u.role === 'admin')
                  .slice(0, 1)
                  .map((a) => (
                    <button
                      key={a.id}
                      type="button"
                      onClick={() => {
                        setActiveRoleTab('admin');
                        setIdInput(a.id);
                        setPassInput(a.pass);
                      }}
                      className="p-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-amber-300 text-[10px] font-semibold cursor-pointer truncate px-2"
                      title={`${a.name} (${a.id})`}
                    >
                      {a.name.split(' ')[0]} ({a.id})
                    </button>
                  ))}
              </div>
            </div>
          </div>

          {/* Forgot Password Modal */}
          {forgotModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0f1523] border border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4">
                <h3 className="text-sm font-bold text-white flex items-center gap-2">
                  <Key className="w-4 h-4 text-indigo-400" /> Reset Password Request
                </h3>
                {!otpSent ? (
                  <div className="space-y-3 text-xs">
                    <p className="text-slate-400">Enter your registered Enrollment No / ID and Email to receive a password reset link/OTP.</p>
                    <input
                      type="text"
                      placeholder="Enrollment Number / ID"
                      value={forgotId}
                      onChange={(e) => setForgotId(e.target.value)}
                      className="w-full p-3 bg-[#070a12] border border-slate-800 rounded-xl text-white font-mono"
                    />
                    <input
                      type="email"
                      placeholder="Registered University Email"

                    <div className="flex gap-2">
                      <button type="button" onClick={() => setForgotModal(false)} className="flex-1 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl cursor-pointer">

                      </button>

                        Send Reset Link

                  <div className="space-y-3 text-xs text-center">

                      <Check className="w-5 h-5" />
                    </div>
                    <p className="text-emerald-300 font-semibold">Password Reset Email Dispatched!</p>
                    <p className="text-slate-400 text-[11px]">
                      Temporary verification OTP: <strong className="text-white font-mono">849201</strong> sent to your email.
                    </p>
                    <button
                      type="button"
                      onClick={() => {
                        setForgotModal(false);
                        setOtpSent(false);
                      }}
                      className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl cursor-pointer"
                    >
                      Return to Login
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 2. MAIN PORTAL DASHBOARD (AUTHENTICATED)
    // ==========================================
    function PortalDashboard({
      user,
      onLogout,
      users,
      setUsers,
      attendance,
      setAttendance,
      results,
      setResults,
      sessionToken,
      qrCountdown,
      mismatchLogs,
      setMismatchLogs,
      activeCameraSubjectId,
      setActiveCameraSubjectId,
      activeQrOwnerId,
      setActiveQrOwnerId,
      studentSessionMarks,
      setStudentSessionMarks,
      campusUpdates,
      setCampusUpdates
    }) {
      const syncedUser = users.find((u) => u.id === user.id) || user;
      const [showUserPass, setShowUserPass] = useState(false);
      const [activeTab, setActiveTab] = useState(
        syncedUser.role === 'admin' ? 'directory' : syncedUser.role === 'faculty' ? 'live' : 'student-dashboard'

      const [camEnrollModal, setCamEnrollModal] = useState(false);

      return (
        <div className="flex-1 flex flex-col overflow-hidden bg-[#090d16]">

            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shadow-lg shadow-indigo-600/30">
                MU
              </div>
              <div>
                <h1 className="text-sm font-bold text-white tracking-wide">Marwadi University ICT</h1>
                <p className="text-[10px] text-emerald-400 flex items-center gap-1 font-semibold">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" /> Smart Attendance & Activity System
                </p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex items-center gap-3 bg-[#070a12] border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                <div className="w-7 h-7 rounded-full bg-indigo-600/30 text-indigo-300 flex items-center justify-center font-bold overflow-hidden border border-indigo-500/40">
                  {syncedUser.photo ? (
                    <img src={syncedUser.photo} alt={syncedUser.name} className="w-full h-full object-cover" />
                  ) : (
                    syncedUser.name.charAt(0)
                  )}
                </div>
                <div className="text-left">
                  <div className="font-bold text-slate-200 text-[11px]">{syncedUser.name}</div>
                  <div className="text-[10px] text-slate-400 font-mono flex items-center gap-1.5">
                    <span className="text-slate-500">{syncedUser.role.toUpperCase()}</span> |
                    <span>
                      Pass: <strong className="text-cyan-300">{showUserPass ? syncedUser.pass : '••••••••'}</strong>
                    </span>
                    <button
                      type="button"
                      onClick={() => setShowUserPass(!showUserPass)}
                      className="text-slate-400 hover:text-cyan-400 transition cursor-pointer"
                    >
                      {showUserPass ? <EyeOff className="w-3 h-3" /> : <Eye className="w-3 h-3" />}
                    </button>
                  </div>
                </div>
              </div>

              {syncedUser.role === 'admin' && (
                <button
                  type="button"
                  onClick={() => {
                    setTargetStudentForReset(null);
                    setCamEnrollModal(true);
                  }}
                  className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 transition cursor-pointer"
                >
                  <Camera className="w-3.5 h-3.5" />
                  <span>Camera Enrollment</span>
                </button>
              )}

              <button
                type="button"
                onClick={onLogout}
                className="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-red-600/30 transition cursor-pointer"
              >
                <LogOut className="w-3.5 h-3.5" />
                <span>Logout</span>
              </button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden">
            {/* Sidebar Nav */}
            <aside className="w-60 border-r border-slate-800 bg-[#0c101c] p-4 flex flex-col space-y-1 text-xs shrink-0">
              {syncedUser.role === 'admin' && (
                <>
                  <SidebarItem icon={BarChart2} label="System Analytics" active={activeTab === 'analytics'} onClick={() => setActiveTab('analytics')} />
                  <SidebarItem icon={Users} label="User Directory & Keys" active={activeTab === 'directory'} onClick={() => setActiveTab('directory')} />
                  <SidebarItem icon={AlertTriangle} label="Defaulter Alerts (<75%)" active={activeTab === 'defaulters'} onClick={() => setActiveTab('defaulters')} />
                  <SidebarItem icon={BookOpen} label="Master Curriculum" active={activeTab === 'curriculum'} onClick={() => setActiveTab('curriculum')} />
                  <SidebarItem icon={FileText} label="Activity Logs" active={activeTab === 'logs'} onClick={() => setActiveTab('logs')} />
                  <SidebarItem icon={MapPin} label="Classroom Allocator" active={activeTab === 'allocator'} onClick={() => setActiveTab('allocator')} />
                  <SidebarItem icon={Sliders} label="Biometric Sensitivity" active={activeTab === 'sensitivity'} onClick={() => setActiveTab('sensitivity')} />
                </>
              )}

              {syncedUser.role === 'faculty' && (
                <>
                  <SidebarItem icon={Video} label="Live Attendance Engine" active={activeTab === 'live'} onClick={() => setActiveTab('live')} />
                  <SidebarItem icon={Calendar} label="Assignments, Holidays & Events" active={activeTab === 'updates'} onClick={() => setActiveTab('updates')} />
                  <SidebarItem icon={Award} label="Grade & Result Entry" active={activeTab === 'grades'} onClick={() => setActiveTab('grades')} />
                  <SidebarItem icon={HelpCircle} label="Live Quiz & Polls" active={activeTab === 'polls'} onClick={() => setActiveTab('polls')} />
                  <SidebarItem icon={FileCheck} label="Assignment Plagiarism" active={activeTab === 'plagiarism'} onClick={() => setActiveTab('plagiarism')} />
                  <SidebarItem icon={Bell} label="Low Attendance Alerts" active={activeTab === 'faculty-alerts'} onClick={() => setActiveTab('faculty-alerts')} />
                </>
              )}

              {syncedUser.role === 'student' && (
                <>
                  <SidebarItem icon={Gauge} label="Student Dashboard" active={activeTab === 'student-dashboard'} onClick={() => setActiveTab('student-dashboard')} />
                  <SidebarItem icon={QrCode} label="Scan Faculty QR" active={activeTab === 'scan'} onClick={() => setActiveTab('scan')} />
                  <SidebarItem icon={Calendar} label="Timetable & Schedule" active={activeTab === 'timetable'} onClick={() => setActiveTab('timetable')} />
                  <SidebarItem icon={FileCode2} label="Assignments Hub" active={activeTab === 'assignments'} onClick={() => setActiveTab('assignments')} />
                  <SidebarItem icon={GraduationCap} label="Results & Transcript" active={activeTab === 'results'} onClick={() => setActiveTab('results')} />
                  <SidebarItem icon={BookOpen} label="Curriculum Progress" active={activeTab === 'curriculum-progress'} onClick={() => setActiveTab('curriculum-progress')} />
                  <SidebarItem icon={CalendarCheck} label="Holidays & Events" active={activeTab === 'holidays-events'} onClick={() => setActiveTab('holidays-events')} />
                </>
              )}
            </aside>

            {/* Main Body */}
            <main className="flex-1 p-6 overflow-y-auto bg-[#090d16]">
              {/* ADMIN VIEWS */}
              {syncedUser.role === 'admin' && activeTab === 'directory' && (
                <AdminUserDirectory
                  users={users}
                  setUsers={setUsers}
                  onResetFace={(student) => {
                    setTargetStudentForReset(student.id);
                    setCamEnrollModal(true);
                  }}
                />
              )}
              {syncedUser.role === 'admin' && activeTab === 'analytics' && <AdminAnalytics users={users} attendance={attendance} mismatchLogs={mismatchLogs} />}
              {syncedUser.role === 'admin' && activeTab === 'defaulters' && <AdminDefaulters attendance={attendance} users={users} />}
              {syncedUser.role === 'admin' && activeTab === 'sensitivity' && <AdminBiometricSensitivity />}
              {syncedUser.role === 'admin' && activeTab === 'allocator' && <AdminClassroomAllocator users={users} />}
              {syncedUser.role === 'admin' && activeTab === 'curriculum' && <AdminMasterCurriculum />}
              {syncedUser.role === 'admin' && activeTab === 'logs' && <AdminActivityLogs mismatchLogs={mismatchLogs} />}

              {/* FACULTY VIEWS */}
              {syncedUser.role === 'faculty' && activeTab === 'live' && (
                <FacultyLiveAttendance
                  facultyUser={syncedUser}
                  users={users}
                  sessionToken={sessionToken}
                  qrCountdown={qrCountdown}
                  attendance={attendance}
                  setAttendance={setAttendance}
                  mismatchLogs={mismatchLogs}
                  setMismatchLogs={setMismatchLogs}
                  activeCameraSubjectId={activeCameraSubjectId}
                  setActiveCameraSubjectId={setActiveCameraSubjectId}
                  activeQrOwnerId={activeQrOwnerId}
                  setActiveQrOwnerId={setActiveQrOwnerId}
                  studentSessionMarks={studentSessionMarks}
                  setStudentSessionMarks={setStudentSessionMarks}
                />
              )}
              {syncedUser.role === 'faculty' && activeTab === 'updates' && (
                <FacultyUpdatesManager facultyUser={syncedUser} campusUpdates={campusUpdates} setCampusUpdates={setCampusUpdates} />
              )}
              {syncedUser.role === 'faculty' && activeTab === 'grades' && <FacultyGradeEntry users={users} results={results} setResults={setResults} />}
              {syncedUser.role === 'faculty' && activeTab === 'polls' && <FacultyLiveQuizPoll />}
              {syncedUser.role === 'faculty' && activeTab === 'plagiarism' && <FacultyPlagiarismCheck />}
              {syncedUser.role === 'faculty' && activeTab === 'faculty-alerts' && <FacultyMassAlerts attendance={attendance} users={users} />}

              {/* STUDENT VIEWS */}
              {syncedUser.role === 'student' && activeTab === 'student-dashboard' && (
                <StudentDashboardOverview
                  studentUser={syncedUser}
                  attendance={attendance[syncedUser.id]}
                  results={results[syncedUser.id]}
                  campusUpdates={campusUpdates}
                  studentSessionMarks={studentSessionMarks}
                  onNavigate={setActiveTab}
                />
              )}
              {syncedUser.role === 'student' && activeTab === 'scan' && (
                <StudentQrScanner
                  studentUser={syncedUser}
                  users={users}
                  sessionToken={sessionToken}
                  qrCountdown={qrCountdown}
                  attendance={attendance}
                  setAttendance={setAttendance}
                  setMismatchLogs={setMismatchLogs}
                  activeQrOwnerId={activeQrOwnerId}
                  setStudentSessionMarks={setStudentSessionMarks}
                />
              )}
              {syncedUser.role === 'student' && activeTab === 'timetable' && <StudentTimetableSchedule users={users} />}
              {syncedUser.role === 'student' && activeTab === 'assignments' && <StudentAssignmentsHub campusUpdates={campusUpdates} />}
              {syncedUser.role === 'student' && activeTab === 'results' && <StudentResultsTranscript studentUser={syncedUser} results={results[syncedUser.id]} />}
              {syncedUser.role === 'student' && activeTab === 'curriculum-progress' && <StudentCurriculumProgress users={users} />}
              {syncedUser.role === 'student' && activeTab === 'holidays-events' && <StudentHolidaysEvents campusUpdates={campusUpdates} />}
            </main>
          </div>

          {camEnrollModal && (
            <CameraEnrollmentModal
              onClose={() => setCamEnrollModal(false)}
              users={users}
              setUsers={setUsers}
              initialStudentId={targetStudentForReset}
              setActiveCameraSubjectId={setActiveCameraSubjectId}
            />
          )}
        </div>
      );
    }

    // Camera Enrollment & Reset Photo Component (Real Webcam Capture & File Fallback)
    function CameraEnrollmentModal({ onClose, users, setUsers, initialStudentId, setActiveCameraSubjectId }) {
      const students = users.filter((u) => u.role === 'student');
      const [selectedId, setSelectedId] = useState(initialStudentId || students[0]?.id || '');
      const [facingMode, setFacingMode] = useState('user');
      const [captured, setCaptured] = useState(false);
      const [tempImage, setTempImage] = useState(null);
      const [tempVector, setTempVector] = useState(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState('');
      const videoRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        let stream = null;
        setCameraError('');
        if (!captured) {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices
              .getUserMedia({ video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } } })
              .then((s) => {
                stream = s;
                setCameraActive(true);
                if (videoRef.current) {
                  videoRef.current.srcObject = s;
                }
              })
              .catch(() => {
                navigator.mediaDevices
                  .getUserMedia({ video: true })
                  .then((s) => {
                    stream = s;
                    setCameraActive(true);
                    if (videoRef.current) videoRef.current.srcObject = s;
                  })
                  .catch(() => {
                    setCameraActive(false);
                    setCameraError('Live webcam access blocked or unavailable. Use "Upload Real Photo" below.');
                  });
              });
          } else {
            setCameraActive(false);
            setCameraError('Camera API unavailable in this browser. Use "Upload Real Photo" below.');
          }
        }
        return () => stream?.getTracks().forEach((t) => t.stop());
      }, [facingMode, captured]);

      const handleCapture = () => {
        const video = videoRef.current;
        if (video && video.videoWidth > 0 && video.videoHeight > 0) {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          if (facingMode === 'user') {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
          }
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const realDataUrl = canvas.toDataURL('image/jpeg', 0.92);
          const vec = computeImageBiometricVector(canvas);
          setTempImage(realDataUrl);
          setTempVector(vec);
          setCaptured(true);
        } else {
          fileInputRef.current?.click();
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const img = new Image();
          img.onload = () => {
            const vec = computeImageBiometricVector(img);
            setTempImage(dataUrl);
            setTempVector(vec);
            setCaptured(true);
            setCameraError('');
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      };

      const handleSave = () => {
        if (!selectedId || !tempImage) return;
        const newSig = `BIO-FACE-${selectedId.slice(-5)}-${Math.random().toString(16).slice(2, 6).toUpperCase()}`;
        setUsers((prev) =>
          prev.map((u) =>
            u.id === selectedId
              ? { ...u, photo: tempImage, faceSignature: newSig, faceVector: tempVector, isRealEnrolled: true }
              : u
          )
        );
        if (setActiveCameraSubjectId) {
          setActiveCameraSubjectId(selectedId);
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-[#0f1523] border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 text-xs">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="flex items-center gap-2 font-bold text-white text-sm">
                <Camera className="w-4 h-4 text-indigo-400" />
                <span>Real Biometric Face Registration & Photo Reset</span>
              </div>
              <button type="button" onClick={onClose} className="text-slate-400 hover:text-white font-bold text-sm cursor-pointer">
                ✕
              </button>
            </div>

            <div className="space-y-1">
              <label className="text-slate-400">Target Student Profile:</label>
              <select
                value={selectedId}
                onChange={(e) => {
                  setSelectedId(e.target.value);
                  setCaptured(false);
                  setTempImage(null);
                  setTempVector(null);
                }}
                className="w-full p-2.5 bg-[#070a12] border border-slate-800 rounded-xl text-white font-semibold"
              >
                {students.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.name} ({s.roll || s.id})
                  </option>
                ))}
              </select>
            </div>

            <input
              ref={fileInputRef}
              type="file"
              accept="image/*"
              capture="user"
              onChange={handleFileUpload}
              className="hidden"
            />

            <div className="relative aspect-video bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex items-center justify-center">
              {!captured ? (
                <>
                  <video
                    ref={videoRef}
                    autoPlay
                    playsInline
                    muted
                    className={`w-full h-full object-cover ${facingMode === 'user' ? 'scale-x-[-1]' : ''}`}
                  />
                  {cameraActive && (
                    <div className="absolute inset-6 border-2 border-dashed border-emerald-400/80 rounded-full pointer-events-none" />
                  )}
                  {cameraError && (
                    <div className="absolute inset-0 bg-slate-950/90 p-4 flex flex-col items-center justify-center text-center gap-2">
                      <AlertCircle className="w-6 h-6 text-amber-400" />
                      <p className="text-slate-300 text-[11px]">{cameraError}</p>
                    </div>
                  )}
                  <div className="absolute bottom-3 right-3 flex items-center gap-1.5 z-10">
                    <button
                      type="button"
                      onClick={() => setFacingMode('user')}
                      className={`px-2.5 py-1.5 border rounded-xl text-[10px] font-bold cursor-pointer ${
                        facingMode === 'user'
                          ? 'bg-indigo-600 border-indigo-400 text-white'
                          : 'bg-slate-900/85 border-slate-700 text-slate-300 hover:text-white'
                      }`}
                    >
                      Front Cam
                    </button>
                    <button
                      type="button"
                      onClick={() => setFacingMode('environment')}
                      className={`px-2.5 py-1.5 border rounded-xl text-[10px] font-bold cursor-pointer ${
                        facingMode === 'environment'
                          ? 'bg-indigo-600 border-indigo-400 text-white'
                          : 'bg-slate-900/85 border-slate-700 text-slate-300 hover:text-white'
                      }`}
                    >
                      Back Cam
                    </button>
                  </div>
                </>
              ) : (
                <img src={tempImage} alt="Captured real biometric preview" className="w-full h-full object-cover" />
              )}
            </div>

            {!captured ? (
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={handleCapture}
                  className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-indigo-600/30"
                >
                  <Camera className="w-4 h-4" /> Capture Live Photo
                </button>
                <button
                  type="button"
                  onClick={() => fileInputRef.current?.click()}
                  className="px-3.5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
                >
                  <Upload className="w-4 h-4" /> Upload
                </button>
              </div>
            ) : (
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => {
                    setCaptured(false);
                    setTempImage(null);
                    setTempVector(null);
                  }}
                  className="flex-1 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl cursor-pointer"
                >
                  Retake
                </button>
                <button
                  type="button"
                  onClick={handleSave}
                  className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl cursor-pointer"
                >
                  Save Real Biometric Photo
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SidebarItem({ icon: Icon, label, active, onClick }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`w-full p-2.5 rounded-xl flex items-center gap-3 font-semibold transition text-xs cursor-pointer text-left ${
            active ? 'bg-[#5852f2] text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'

                              <Trash2 className="w-3 h-3" /> Delete

                      ) : (
                        <button

                          onClick={() => startEditingName(u)}
                          className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 rounded-lg text-[11px] font-semibold flex items-center gap-1 transition cursor-pointer"

                <input required placeholder="Enrollment No / Staff ID" value={newUser.id} onChange={(e) => setNewUser({ ...newUser, id: e.target.value })} className="w-full p-3 bg-[#070a12] border border-slate-800 rounded-xl text-white font-mono" />

                <select value={newUser.role} onChange={(e) => setNewUser({ ...newUser, role: e.target.value })} className="w-full p-3 bg-[#070a12] border border-slate-800 rounded-xl text-white">

                <div className="flex gap-2">

    // ==========================================
    // 4. FACULTY PORTAL COMPONENTS
    // ==========================================
    function FacultyLiveAttendance({
      facultyUser,
      users,
      sessionToken,
      qrCountdown,
      attendance,
      setAttendance,
      mismatchLogs,
      setMismatchLogs,
      activeCameraSubjectId,
      setActiveCameraSubjectId,
      activeQrOwnerId,
      setActiveQrOwnerId,
      studentSessionMarks,
      setStudentSessionMarks
    }) {
      const [selectedStudent, setSelectedStudent] = useState(activeQrOwnerId || '92500133046');
      const [statusMsg, setStatusMsg] = useState(null);
      const [facingMode, setFacingMode] = useState('user');
      const [activeMode, setActiveMode] = useState('all');
      const videoRef = useRef(null);

      const students = users.filter((u) => u.role === 'student');
      const targetStudentObj = students.find((u) => u.id === selectedStudent) || students[0];
      const cameraPersonObj = students.find((u) => u.id === activeCameraSubjectId) || students[0];
      const qrSelectedStudentObj = students.find((u) => u.id === activeQrOwnerId) || students[0];
      const activeUniqueQrCode = `${sessionToken}-${qrSelectedStudentObj?.roll || ''}`;

      useEffect(() => {
        let stream = null;
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices
            .getUserMedia({ video: { facingMode: { ideal: facingMode } } })
            .then((s) => {
              stream = s;
              if (videoRef.current) videoRef.current.srcObject = s;
            })
            .catch(() => {
              navigator.mediaDevices
                .getUserMedia({ video: true })
                .then((s) => {
                  stream = s;
                  if (videoRef.current) videoRef.current.srcObject = s;
                })
                .catch(() => {});
            });
        }

        return () => stream?.getTracks().forEach((t) => t.stop());
      }, [facingMode]);

      const markStudentAttendance = (studentId, isPresent, source = 'Faculty Manual / Face') => {
        const subj = facultyUser.subject || 'PWP';
        setAttendance((prev) => {
          const studentAtt = prev[studentId] || { [subj]: { present: 0, total: 0 } };
          const currentSubj = studentAtt[subj] || { present: 0, total: 0 };
          return {
            ...prev,
            [studentId]: {
              ...studentAtt,
              [subj]: {
                present: currentSubj.present + (isPresent ? 1 : 0),
                total: currentSubj.total + 1
              }
            }
          };
        });
        setStudentSessionMarks((prev) => ({
          ...prev,
          [studentId]: {
            status: isPresent ? 'Marked as Present' : 'Marked Absent',
            source,
            time: new Date().toLocaleTimeString()
          }
        }));
      };

      // Strict Face Verification comparing real enrolled biometric faceVector & enrolled camera person against target student
      const handleFaceVerification = () => {
        if (!targetStudentObj || !cameraPersonObj) return;

        // 1. Check if the person who enrolled/stepped onto the camera differs from the target student
        if (activeCameraSubjectId !== selectedStudent) {
          setStatusMsg({
            type: 'error',
            text: `BIOMETRIC MISMATCH! Scanner target is ${targetStudentObj.name} (${targetStudentObj.roll}), but enrolled camera face belongs to ${cameraPersonObj.name} (${cameraPersonObj.roll}). Proxy blocked!`
          });
          setMismatchLogs((prev) => [
            ...prev,
            {
              student: `Target: ${targetStudentObj.name} (${targetStudentObj.roll}) | Enrolled Camera Face: ${cameraPersonObj.name} (${cameraPersonObj.roll})`,
              time: new Date().toLocaleTimeString()
            }
          ]);
          return;
        }

        // 2. If a real webcam biometric vector was enrolled for this student, also verify live webcam frame similarity
        if (targetStudentObj.faceVector && videoRef.current && videoRef.current.videoWidth > 0) {
          const liveVec = computeImageBiometricVector(videoRef.current);
          const similarity = computeCosineSimilarity(liveVec, targetStudentObj.faceVector);
          if (similarity !== null && similarity < 0.82) {
            setStatusMsg({
              type: 'error',
              text: `BIOMETRIC MISMATCH! Live camera face does not match ${targetStudentObj.name}'s enrolled biometric vector (Similarity: ${Math.round(
                similarity * 100
              )}%).`
            });
            setMismatchLogs((prev) => [
              ...prev,
              {
                student: `Target: ${targetStudentObj.name} | Live Face Similarity Mismatch (${Math.round(similarity * 100)}%)`,
                time: new Date().toLocaleTimeString()
              }
            ]);
            return;
          }
        }

        setStatusMsg({
          type: 'success',
          text: `Biometric Match Verified! Face matches ${targetStudentObj.name} (${targetStudentObj.roll}). Marked as Present!`
        });
        markStudentAttendance(selectedStudent, true, 'Faculty Face Recognition');
      };

      return (
        <div className="space-y-6 text-xs">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-base font-bold text-white uppercase tracking-wider">Live Attendance Engine</h2>
              <p className="text-slate-400">
                Faculty: <strong className="text-indigo-400">{facultyUser.name}</strong> ({facultyUser.dept})
              </p>
            </div>
            <div className="px-3 py-1.5 bg-[#070a12] border border-slate-800 rounded-xl text-emerald-400 font-mono font-bold flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" /> Live Student QR & Face Sync Active
            </div>
          </div>

          {/* Mode Filter Bar */}
          <div className="grid grid-cols-3 gap-2 bg-[#0e1422] p-2 rounded-2xl border border-slate-800">
            <button
              type="button"
              onClick={() => setActiveMode('all')}
              className={`py-2.5 px-3 rounded-xl font-bold flex items-center justify-center gap-2 transition cursor-pointer ${
                activeMode === 'all' ? 'bg-[#5852f2] text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'
              }`}
            >
              <Layers className="w-4 h-4" /> All Modes
            </button>
            <button
              type="button"
              onClick={() => setActiveMode('face')}
              className={`py-2.5 px-3 rounded-xl font-bold flex items-center justify-center gap-2 transition cursor-pointer ${
                activeMode === 'face' ? 'bg-[#5852f2] text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'
              }`}
            >
              <Video className="w-4 h-4 text-emerald-400" /> Face Recognition

                  setActiveQrOwnerId(e.target.value);
                  setSelectedStudent(e.target.value);
                  setStatusMsg(null);

          {/* AI Face Recognition Camera Scanner */}

                <span className="font-bold text-white text-xs">AI Face Scanner Engine ({facultyUser.name})</span>

                    <div className="text-[10px] leading-tight">

                    {students.map((s) => {
                      const subj = facultyUser.subject || 'PWP';
                      const rec = attendance[s.id]?.[subj] || { present: 0, total: 0 };
                      const pct = rec.total > 0 ? Math.round((rec.present / rec.total) * 100) : 100;
                      const sessionRecord = studentSessionMarks[s.id];

                      return (
                        <tr key={s.id} className="hover:bg-slate-800/20">

                          <td className="p-3 font-mono text-slate-400">{s.roll}</td>
                          <td className="p-3 font-mono">

                              <button

    function FacultyUpdatesManager({ facultyUser, campusUpdates, setCampusUpdates }) {
      const [category, setCategory] = useState('Assignment');
      const [subject, setSubject] = useState(facultyUser.subject || 'PWP');
      const [title, setTitle] = useState('');
      const [date, setDate] = useState('2026-11-20');
      const [details, setDetails] = useState('');

      const handlePublish = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        const newEntry = {
          id: 'UPD-' + Math.floor(100 + Math.random() * 900),
          category,
          subject: category === 'Holiday' ? 'ALL' : subject,
          title: title.trim(),
          date,
          details: details.trim() || 'Published by ' + facultyUser.name,
          postedBy: facultyUser.name
        };
        setCampusUpdates([newEntry, ...campusUpdates]);
        setTitle('');
        setDetails('');
      };

      const handleDeleteUpdate = (id) => {
        setCampusUpdates((prev) => prev.filter((item) => item.id !== id));
      };

      return (
        <div className="space-y-6 text-xs">
          <div>
            <h2 className="text-base font-bold text-white uppercase tracking-wider">Assignments, Holidays & Campus Events</h2>
            <p className="text-slate-400">Publish new assignments, university holidays, or ICT events directly to the Student Dashboard</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <form onSubmit={handlePublish} className="bg-[#0e1422] border border-slate-800 rounded-2xl p-6 space-y-4">
              <h3 className="text-sm font-bold text-white flex items-center gap-2">
                <Plus className="w-4 h-4 text-indigo-400" /> Add New Student Update
              </h3>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 mb-1">Update Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full p-2.5 bg-[#070a12] border border-slate-800 rounded-xl text-white font-semibold"
                  >
                    <option value="Assignment">Assignment</option>
                    <option value="Holiday">Holiday</option>
                    <option value="Event">Campus / Dept Event</option>
                  </select>
                </div>

                <div>
                  <label className="block text-slate-400 mb-1">Subject / Scope</label>
                  <select
                    value={subject}
                    onChange={(e) => setSubject(e.target.value)}
                    disabled={category === 'Holiday'}
                    className="w-full p-2.5 bg-[#070a12] border border-slate-800 rounded-xl text-white font-semibold disabled:opacity-50"
                  >
                    <option value="PWP">PWP</option>
                    <option value="DMGT">DMGT</option>
                    <option value="COA">COA</option>
                    <option value="DSC">DSC</option>
                    <option value="ICT Dept">ICT Department</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-slate-400 mb-1">Title</label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="e.g., Unit 4 Graph Theory Problem Set / TechFest 2026"
                  className="w-full p-3 bg-[#070a12] border border-slate-800 rounded-xl text-white"
                />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">Date / Due Date</label>
                <input
                  type="date"
                  required
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="w-full p-3 bg-[#070a12] border border-slate-800 rounded-xl text-white font-mono"
                />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">Description & Instructions</label>
                <textarea
                  rows="3"
                  value={details}
                  onChange={(e) => setDetails(e.target.value)}
                  placeholder="Enter instructions, venue, or holiday notice details..."
                  className="w-full p-3 bg-[#070a12] border border-slate-800 rounded-xl text-white"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3 bg-[#5852f2] hover:bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 cursor-pointer"
              >
                Publish to Student Dashboard
              </button>
            </form>

            <div className="bg-[#0e1422] border border-slate-800 rounded-2xl p-6 space-y-3">
              <h3 className="text-sm font-bold text-white">Published Items ({campusUpdates.length})</h3>
              <div className="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                {campusUpdates.map((item) => (
                  <div key={item.id} className="p-3.5 bg-[#070a12] border border-slate-800 rounded-xl flex items-start justify-between gap-3">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span
                          className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            item.category === 'Assignment'
                              ? 'bg-indigo-950 text-indigo-300 border border-indigo-800'
                              : item.category === 'Holiday'
                              ? 'bg-amber-950 text-amber-300 border border-amber-800'
                              : 'bg-emerald-950 text-emerald-300 border border-emerald-800'
                          }`}
                        >
                          {item.category.toUpperCase()}
                        </span>
                        <span className="text-[10px] font-mono text-slate-400">{item.date}</span>
                      </div>
                      <div className="font-bold text-white text-xs">{item.title}</div>
                      <p className="text-[11px] text-slate-400">{item.details}</p>
                      <div className="text-[10px] text-slate-500">Posted by {item.postedBy}</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => handleDeleteUpdate(item.id)}
                      className="p-1.5 bg-red-950/70 hover:bg-red-900 border border-red-800/80 text-red-300 rounded-lg cursor-pointer"
                      title="Remove item"
                    >
                      <Trash2 className="w-3.5 h-3.5" />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. STUDENT PORTAL COMPONENTS
    // ==========================================
    function StudentDashboardOverview({ studentUser, attendance, results, campusUpdates, studentSessionMarks, onNavigate }) {
      const subjects = attendance
        ? Object.entries(attendance)
        : [
            ['PWP', { present: 28, total: 30 }],
            ['DMGT', { present: 25, total: 28 }],
            ['COA', { present: 26, total: 26 }],
            ['DSC', { present: 24, total: 27 }]
          ];

      const totalPresent = subjects.reduce((acc, [, d]) => acc + d.present, 0);
      const totalSessions = subjects.reduce((acc, [, d]) => acc + d.total, 0);
      const overallPct = totalSessions > 0 ? Math.round((totalPresent / totalSessions) * 1000) / 10 : 100;
      const safeMisses = Math.max(0, Math.floor(totalPresent / 0.75 - totalSessions));
      const requiredClasses = overallPct < 75 ? Math.ceil((0.75 * totalSessions - totalPresent) / 0.25) : 0;

      const assignmentCount = campusUpdates.filter((u) => u.category === 'Assignment').length;
      const holidayEventCount = campusUpdates.filter((u) => u.category !== 'Assignment').length;

    function StudentQrScanner({
      studentUser,
      users,
      sessionToken,
      qrCountdown,
      attendance,
      setAttendance,
      setMismatchLogs,
      activeQrOwnerId,
      setStudentSessionMarks
    }) {
      const [selectedSubject, setSelectedSubject] = useState('PWP');
      const [scanResult, setScanResult] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const videoRef = useRef(null);

      const students = users.filter((u) => u.role === 'student');
      const activeFaculty = users.find((u) => u.role === 'faculty' && u.subject === selectedSubject) || users.find((u) => u.role === 'faculty');
      const qrOwnerObj = students.find((u) => u.id === activeQrOwnerId) || studentUser;
      const myUniqueQrCode = `${sessionToken}-${studentUser.roll}`;
      const scannedQrCode = `${sessionToken}-${qrOwnerObj.roll}`;

      useEffect(() => {
        setScanResult(null);
      }, [studentUser.id]);

      useEffect(() => {
        let stream = null;
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices
            .getUserMedia({ video: { facingMode: { ideal: facingMode } } })
            .then((s) => {
              stream = s;
              if (videoRef.current) videoRef.current.srcObject = s;
            })
            .catch(() => {
              navigator.mediaDevices
                .getUserMedia({ video: true })
                .then((s) => {
                  stream = s;
                  if (videoRef.current) videoRef.current.srcObject = s;
                })
                .catch(() => {});
            });
        }

        return () => stream?.getTracks().forEach((t) => t.stop());
      }, [facingMode]);

      const recordStudentPresent = () => {
        setAttendance((prev) => {
          const stu = prev[studentUser.id] || { [selectedSubject]: { present: 0, total: 0 } };
          const sub = stu[selectedSubject] || { present: 0, total: 0 };
          return {
            ...prev,
            [studentUser.id]: {
              ...stu,
              [selectedSubject]: {
                present: sub.present + 1,
                total: sub.total + 1
              }
            }
          };
        });

        setStudentSessionMarks((prev) => ({
          ...prev,
          [studentUser.id]: {
            status: 'Marked as Present',
            source: `Student Portal QR (${selectedSubject})`,
            time: new Date().toLocaleTimeString()
          }
        }));
      };

      // Scans the live QR code currently displayed by Faculty on the Faculty Dashboard
      const handleUniqueQrScan = () => {
        if (activeQrOwnerId !== studentUser.id) {
          setScanResult({
            type: 'error',
            title: 'Mismatch QR Code',
            text: `Mismatch QR Code! You scanned ${qrOwnerObj.name}'s (${qrOwnerObj.roll}) QR code from ${studentUser.name}'s (${studentUser.roll}) portal. Attendance rejected!`
          });
          setMismatchLogs((prev) => [
            ...prev,
            {
              student: `QR Mismatch: ${studentUser.name} (${studentUser.roll}) scanned ${qrOwnerObj.name}'s QR (${scannedQrCode})`,
              time: new Date().toLocaleTimeString()
            }
          ]);
          return;
        }

        recordStudentPresent();
        setScanResult({
          type: 'success',
          title: 'Marked as Present!',
          text: `QR Code Verified (${myUniqueQrCode})! ${studentUser.name} is now Marked as Present in ${activeFaculty?.name || 'Faculty'}'s Dashboard for ${selectedSubject}.`
        });
      };

      return (
        <div className="space-y-6 text-xs max-w-md mx-auto">
          <div className="text-center">
            <h2 className="text-base font-bold text-white uppercase tracking-wider">Scan Faculty Live QR Code</h2>
            <p className="text-slate-400 mt-0.5">
              Point your camera at the Faculty's screen to scan your assigned QR code
            </p>
          </div>

          <div className="bg-[#0e1422] border border-slate-800 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
            <div className="flex items-center justify-between bg-[#070a12] border border-slate-800 p-3 rounded-xl text-left">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-indigo-600/30 border border-indigo-500/40 overflow-hidden flex items-center justify-center font-bold text-indigo-300">
                  {studentUser.photo ? (
                    <img src={studentUser.photo} alt={studentUser.name} className="w-full h-full object-cover" />
                  ) : (
                    studentUser.name.charAt(0)
                  )}
                </div>
                <div>
                  <div className="font-bold text-white text-xs">{studentUser.name}</div>
                  <div className="text-[10px] font-mono text-slate-400">Roll: {studentUser.roll}</div>
                </div>
              </div>
              <span className="px-2 py-1 bg-indigo-950 border border-indigo-800 text-indigo-300 rounded-lg text-[10px] font-bold">
                QR Scanner
              </span>
            </div>

            <div className="text-left">
              <label className="text-slate-400 text-[10px] block mb-1">Active Subject & Faculty:</label>
              <select
                value={selectedSubject}
                onChange={(e) => {
                  setSelectedSubject(e.target.value);
                  setScanResult(null);
                }}
                className="w-full p-2.5 bg-[#070a12] border border-slate-800 rounded-xl text-white font-semibold"
              >
                <option value="PWP">PWP — Prof. R. K. Sharma / Kawal Kaur</option>
                <option value="DMGT">DMGT — Prof. Biswajit</option>
                <option value="COA">COA — Prof. Vijay Dubey</option>
                <option value="DSC">DSC — Prof. Alam</option>
              </select>
            </div>

            <div className="relative aspect-video bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex items-center justify-center">
              {!scanResult ? (
                <>
                  <video
                    ref={videoRef}
                    autoPlay
                    playsInline
                    muted
                    className={`w-full h-full object-cover ${facingMode === 'user' ? 'scale-x-[-1]' : ''}`}
                  />
                  <div className="absolute inset-6 border-2 border-dashed border-indigo-500 rounded-2xl pointer-events-none animate-pulse" />
                  <div className="absolute top-3 left-3 px-2.5 py-1 bg-slate-900/90 border border-slate-700 rounded-lg text-[10px] font-mono text-indigo-300">
                    {activeFaculty?.name || 'Faculty'} QR ({qrCountdown}s)
                  </div>
                  <div className="absolute bottom-3 right-3 flex items-center gap-1.5 z-10">
                    <button
                      type="button"
                      onClick={() => setFacingMode('user')}
                      className={`px-2.5 py-1.5 border rounded-xl text-[10px] font-bold cursor-pointer ${
                        facingMode === 'user'
                          ? 'bg-indigo-600 border-indigo-400 text-white'
                          : 'bg-slate-900/85 border-slate-700 text-slate-300 hover:text-white'
                      }`}
                    >
                      Front Cam
                    </button>
                    <button
                      type="button"
                      onClick={() => setFacingMode('environment')}
                      className={`px-2.5 py-1.5 border rounded-xl text-[10px] font-bold cursor-pointer ${
                        facingMode === 'environment'
                          ? 'bg-indigo-600 border-indigo-400 text-white'
                          : 'bg-slate-900/85 border-slate-700 text-slate-300 hover:text-white'
                      }`}
                    >
                      Back Cam
                    </button>
                  </div>
                </>
              ) : scanResult.type === 'success' ? (
                <div className="p-4 flex flex-col items-center gap-2 text-emerald-400 font-bold">
                  <CheckCircle className="w-12 h-12" />
                  <span className="text-sm">{scanResult.title}</span>
                  <span className="text-[11px] text-slate-300 font-normal leading-relaxed">{scanResult.text}</span>
                </div>
              ) : (
                <div className="p-4 flex flex-col items-center gap-2 text-red-400 font-bold">
                  <AlertTriangle className="w-12 h-12" />
                  <span className="text-sm">{scanResult.title}</span>
                  <span className="text-[11px] text-red-200 font-normal leading-relaxed">{scanResult.text}</span>
                </div>
              )}
            </div>

            {!scanResult ? (
              <button
                type="button"
                onClick={handleUniqueQrScan}
                className="w-full py-3 px-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 cursor-pointer"
              >
                <QrCode className="w-4 h-4" /> Scan Faculty QR Code
              </button>
            ) : (
              <button
                type="button"
                onClick={() => setScanResult(null)}
                className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl cursor-pointer"
              >
                Reset & Scan Again
              </button>
            )}
          </div>
        </div>
      );
    }

            )}
            {items.map((item) => (
              <div key={item.id} className="bg-[#0e1422] border border-slate-800 rounded-2xl p-5 space-y-2">
                <div className="flex items-center justify-between">
                  <span
                    className={`px-2.5 py-0.5 rounded text-[10px] font-bold ${
                      item.category === 'Holiday'
                        ? 'bg-amber-950 text-amber-300 border border-amber-800'
                        : 'bg-emerald-950 text-emerald-300 border border-emerald-800'
                    }`}
                  >
                    {item.category.toUpperCase()}
                  </span>
                  <span className="text-slate-400 font-mono text-[11px]">{item.date}</span>
                </div>
                <div className="font-bold text-white text-sm">{item.title}</div>
                <p className="text-slate-400 text-[11px]">{item.details}</p>
                <div className="text-[10px] text-slate-500 pt-1">Published by {item.postedBy}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
